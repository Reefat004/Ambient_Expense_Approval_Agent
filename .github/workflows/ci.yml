name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tests, and offline evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLOUD_PROJECT: ci-project
      GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY: "false"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Lint and formatting
        run: make lint
      - name: Unit and integration tests
        run: make test
      - name: Offline inference
        run: uv run --no-sync python tests/eval/generate_traces.py --offline --output /tmp/expense-eval/traces.json
      - name: Grade offline evidence
        run: uv run --no-sync python tests/eval/grade_traces.py --traces /tmp/expense-eval/traces.json --output /tmp/expense-eval/results.json
